[project]
name = "lovingcool-control"
dynamic = ["version"]
description = "Open-source control for Lovingcool / Lovi.Cool AIO cooler LCD screens"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "hidapi>=0.14.0",
    "Pillow>=10.1.0",
    "numpy>=1.24",
    "pyserial>=3.5",
    "psutil>=5.9.0",
    "opencv-python-headless>=4.8.0",
    "wmi>=1.5.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/imshin-n/LOVINGCOOL-CONTROL"

[project.scripts]
lovingcool-controld = "lovingcool_control.service.daemon:main"
lovingcool-ctl = "lovingcool_control.cli:main"

[project.gui-scripts]
lovingcool-control = "lovingcool_control.gui.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyusb>=1.2.1",   # tools/enumerate.py only
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/lovingcool_control/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lovingcool_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # long lines: existing code wraps by hand; let the formatter decide later
]
